name: CheckPlugin
main: com.example.checkplugin.CheckPlugin
version: "2.0.0"
api: ["1.0.0"]
author: YourName
depend:
  - FakeInventories

commands:
  check:
    description: Система проверок
    usage: "/check <ник> | /check done <ник> | /check leave <ник>"
    permission: checkplugin.use
  ban:
    description: Забанить игрока
    usage: "/ban <ник> <срок> [причина]"
    permission: checkplugin.ban
  mute:
    description: Замутить игрока
    usage: "/mute <ник> <срок> [причина]"
    permission: checkplugin.mute
  unban:
    description: Разбанить игрока
    usage: "/unban <ник>"
    permission: checkplugin.unban
  unmute:
    description: Размутить игрока
    usage: "/unmute <ник>"
    permission: checkplugin.unmute
  checklogs:
    description: Показать последние действия
    usage: "/checklogs [кол-во]"
    permission: checkplugin.logs
  report:
    description: Пожаловаться на игрока
    usage: "/report <ник> <причина>"
    permission: checkplugin.report
  reports:
    description: Открыть список репортов
    usage: "/reports"
    permission: checkplugin.reports

permissions:
  checkplugin.use:
    default: op
  checkplugin.ban:
    default: op
  checkplugin.mute:
    default: op
  checkplugin.unban:
    default: op
  checkplugin.unmute:
    default: op
  checkplugin.logs:
    default: op
  checkplugin.report:
    default: true
  checkplugin.reports:
    default: op